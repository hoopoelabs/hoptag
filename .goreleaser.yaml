version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: hoptag
    main: ./main.go
    binary: hoptag
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/hoopoelabs/hoptag/cmd.Version={{ .Version }}
      - -X github.com/hoopoelabs/hoptag/cmd.Commit={{ .Commit }}
      - -X github.com/hoopoelabs/hoptag/cmd.BuildDate={{ .Date }}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - NOTICE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
